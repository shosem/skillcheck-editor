<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>プログラミングスキルチェック用ランナー</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
<style>
:root{--fs:14px;--fsp:14px}
body.dark{--bg:#1a1b1e;--panel:#232529;--border:#383b41;--text:#e4e6ea;--muted:#9aa0a6;--accent:#4c8dff;--codebg:#1b1c1f;--err:#ff7b7b;--ok:#5fd38d}
body.light{--bg:#eceef1;--panel:#ffffff;--border:#d3d7dd;--text:#1f2328;--muted:#6b7280;--accent:#2563eb;--codebg:#f3f4f6;--err:#d1242f;--ok:#1a7f37}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.65 "Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.mono,textarea.mono,pre{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono CJK JP","Yu Gothic UI",monospace}

header{display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
header .title{font-weight:700;margin-right:6px}
select,button{font:inherit;font-size:13px;color:var(--text);background:var(--codebg);border:1px solid var(--border);border-radius:6px;padding:4px 8px;cursor:pointer}
button:hover,select:hover{border-color:var(--accent)}
button.run{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;padding:5px 18px}
button.run:disabled{opacity:.55;cursor:wait}
button.small{padding:1px 8px;font-size:12px}
.spacer{flex:1}
#status{color:var(--muted);font-size:12px}

main{flex:1;min-height:0;display:flex}
.col{display:flex;flex-direction:column;min-width:0;min-height:0}
#left{width:42%}
#right{flex:1}
.vsplit{width:6px;flex:none;cursor:col-resize;background:var(--border);touch-action:none}
.hsplit{height:6px;flex:none;cursor:row-resize;background:var(--border);touch-action:none}
.vsplit:hover,.hsplit:hover{background:var(--accent)}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel)}
.pane>h2{margin:0;padding:3px 10px;font-size:12px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--border);flex:none}
.pane>h2 .spacer{flex:1}

#pane-problem{flex:1}
#pane-stdin{height:28%}
#pane-editor{flex:1}
#pane-output{height:34%}

#problem-raw{flex:1;min-height:0;width:100%;border:0;outline:0;resize:none;padding:12px;background:var(--panel);color:var(--text);font-size:var(--fsp);line-height:1.6}
#problem-view{flex:1;min-height:0;overflow:auto;padding:10px 16px 24px;outline:0}
#problem-view h3{margin:20px 0 6px;font-size:15px;padding-left:8px;border-left:4px solid var(--accent)}
#problem-view h3:first-child{margin-top:4px}
#problem-view h3.sin,#problem-view h3.sout{font-size:13px;border-color:var(--ok)}
#problem-view p{margin:6px 0;font-size:calc(var(--fsp) + 1px)}
#problem-view pre{margin:6px 0;padding:8px 12px;background:var(--codebg);border:1px solid var(--border);border-radius:6px;font-size:var(--fsp);line-height:1.5;white-space:pre-wrap;word-break:break-all;overflow:auto}
#problem-view ul{margin:6px 0;padding-left:22px}
#problem-view li{margin:2px 0;font-size:calc(var(--fsp) + 1px)}
#problem-view li code{background:var(--codebg);border:1px solid var(--border);border-radius:4px;padding:0 6px;font-size:var(--fsp)}
.sample{position:relative}
.sample button{position:absolute;top:12px;right:8px}
.hint{color:var(--muted);padding:24px 16px;text-align:center}

#stdin{flex:1;min-height:0;width:100%;border:0;outline:0;resize:none;padding:8px 12px;background:var(--codebg);color:var(--text);font-size:var(--fs);line-height:1.5;white-space:pre}

#editor{flex:1;min-height:0;position:relative}
#editor .CodeMirror{position:absolute;inset:0;height:auto;font-size:var(--fs);line-height:1.5;font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono CJK JP","Yu Gothic UI",monospace}
body.light #editor .CodeMirror{background:#fff}

#output{flex:1;min-height:0;overflow:auto;padding:8px 12px;background:var(--codebg);font-size:var(--fs)}
#output pre{margin:0 0 8px;white-space:pre-wrap;word-break:break-all;line-height:1.5}
#output .label{font-size:11px;color:var(--muted);margin:6px 0 2px;font-family:inherit}
#output .err{color:var(--err)}
#output .meta{color:var(--muted);font-size:12px;border-top:1px solid var(--border);padding-top:4px;margin-top:6px}
#output .meta .bad{color:var(--err);font-weight:700}
#output .meta .good{color:var(--ok);font-weight:700}

.CodeMirror-hints{z-index:1000;font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono CJK JP",monospace;font-size:var(--fs);background:var(--panel);border:1px solid var(--border);box-shadow:0 4px 14px rgba(0,0,0,.35);border-radius:6px;padding:2px;max-height:14em}
.CodeMirror-hints .CodeMirror-hint{color:var(--text);border-radius:4px;padding:1px 8px}
.CodeMirror-hints .CodeMirror-hint-active{background:var(--accent);color:#fff}
.CodeMirror-matchingbracket{color:inherit!important;background:rgba(76,141,255,.28);outline:1px solid var(--accent);border-radius:2px}
.CodeMirror-nonmatchingbracket{color:inherit!important;background:rgba(255,107,107,.3)}
.fsbox{display:inline-flex;align-items:center;gap:2px}
.fsval{min-width:2.2em;text-align:center;font-size:11px}
button.toggle.on{border-color:var(--ok);color:var(--ok)}
button.toggle.off{color:var(--muted)}

@media (max-width:820px){
  main{flex-direction:column;overflow:auto}
  #left,#right{width:auto;height:auto;flex:none}
  #pane-problem{height:50vh;flex:none}#pane-editor{height:55vh;flex:none}
  .vsplit{display:none}
  body{overflow:auto}
}
</style>
</head>
<body class="dark">
<header>
  <span class="title">▶ プログラミングスキルチェック用ランナー</span>
  <select id="lang" title="言語"></select>
  <select id="compiler" title="バージョン"></select>
  <button id="run" class="run" title="Ctrl/Cmd + Enter">実行</button>
  <span id="status"></span>
  <span class="spacer"></span>
  <button id="hint-toggle" class="small toggle" title="入力中の単語候補（Tabで確定、Enterは常に改行）">予測変換</button>
  <button id="theme" class="small">ライト/ダーク</button>
</header>

<main id="main">
  <section id="left" class="col">
    <div class="pane" id="pane-problem">
      <h2>問題文 <span class="spacer"></span>
        <span class="fsbox"><button id="fsp-" class="small" title="問題文の文字を小さく">A−</button><span id="fsp-val" class="fsval"></span><button id="fsp+" class="small" title="問題文の文字を大きく">A＋</button></span>
        <button id="btn-edit" class="small">原文を編集</button>
        <button id="btn-clear" class="small">クリア</button></h2>
      <textarea id="problem-raw" spellcheck="false" placeholder="ここに問題文をペーストすると、見やすく整形されます。"></textarea>
      <div id="problem-view" tabindex="0" hidden></div>
    </div>
    <div class="hsplit" data-split="h" data-target="pane-stdin"></div>
    <div class="pane" id="pane-stdin">
      <h2>標準入力（常時表示・ペースト可） <span class="spacer"></span>
        <button id="btn-stdin-clear" class="small">クリア</button></h2>
      <textarea id="stdin" class="mono" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="ここに入力例を貼り付け。実行のたびに自動で使われます。"></textarea>
    </div>
  </section>

  <div class="vsplit" data-split="v" data-target="left"></div>

  <section id="right" class="col">
    <div class="pane" id="pane-editor">
      <h2>コード <span class="spacer"></span><span id="lang-label"></span>
        <button id="btn-indent" class="small">インデントの整形</button>
        <span class="fsbox"><button id="fs-" class="small" title="コード・標準入力・出力の文字を小さく">A−</button><span id="fs-val" class="fsval"></span><button id="fs+" class="small" title="コード・標準入力・出力の文字を大きく">A＋</button></span></h2>
      <div id="editor"></div>
    </div>
    <div class="hsplit" data-split="h" data-target="pane-output"></div>
    <div class="pane" id="pane-output">
      <h2>出力 <span class="spacer"></span><button id="btn-copy-out" class="small">コピー</button></h2>
      <div id="output" class="mono"></div>
    </div>
  </section>
</main>

<script>
/* ========== 問題文の整形（純粋関数） ========== */
const JP = /[\u3001-\u30ff\u3400-\u9fff]/;               // かな・漢字・和文記号
const HEAD = /^(問題文?|入力される値|入力値?|入力形式|入力|期待する出力|出力形式|出力|条件|制約|注意|補足|ヒント|入力例\s*[0-9０-９]*|出力例\s*[0-9０-９]*)\s*[:：]?$/;
const BULLET = /^\s*[・･•●○\-\*]\s*/;

function parseProblem(src) {
  const lines = src.replace(/\r\n?/g, '\n').replace(/\u00a0/g, ' ').split('\n').map(l => l.replace(/\s+$/, ''));
  const blocks = [];
  let kind = 'norm', cur = [];

  function flush() {
    if (kind === 'sin' || kind === 'sout') {
      while (cur.length && !cur[0].trim()) cur.shift();
      while (cur.length && !cur[cur.length - 1].trim()) cur.pop();
      if (cur.length) blocks.push({ type: 'pre', text: cur.join('\n'), sample: kind === 'sin' ? 'in' : 'out' });
    } else {
      let run = null;                       // 連続する同種の行をまとめる
      const end = () => { if (run) blocks.push(run); run = null; };
      for (const raw of cur) {
        if (!raw.trim()) { end(); continue; }
        if (BULLET.test(raw)) {
          const t = raw.replace(BULLET, '');
          if (!run || run.type !== 'ul') { end(); run = { type: 'ul', items: [] }; }
          run.items.push({ text: t, code: !JP.test(t) });
        } else if (!JP.test(raw)) {
          if (!run || run.type !== 'pre') { end(); run = { type: 'pre', text: '', lines: [] }; }
          run.lines.push(raw.trim()); run.text = run.lines.join('\n');
        } else {
          if (!run || run.type !== 'p') { end(); run = { type: 'p', lines: [] }; }
          run.lines.push(raw.trim());
        }
      }
      end();
    }
    cur = [];
  }

  for (const line of lines) {
    const t = line.trim();
    if (HEAD.test(t)) {
      flush();
      kind = /^入力例/.test(t) ? 'sin' : /^出力例/.test(t) ? 'sout' : 'norm';
      blocks.push({ type: 'h', text: t.replace(/[:：]$/, ''), kind });
    } else cur.push(line);
  }
  flush();
  return blocks;
}
function firstSampleInput(blocks) {
  const b = blocks.find(b => b.type === 'pre' && b.sample === 'in');
  return b ? b.text : null;
}

/* ========== ここからブラウザ処理 ========== */
if (typeof document !== 'undefined') (function () {
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  /* --- テーマ・文字サイズ --- */
  let theme = store.get('pz_theme', 'dark');
  let fs = parseInt(store.get('pz_fs', '14'), 10) || 14;                     // コード・標準入力・出力
  let fsp = parseInt(store.get('pz_fsp', String(fs)), 10) || fs;             // 問題文（未設定なら従来の値を引き継ぐ）
  function applyLook() {
    document.body.className = theme;
    document.documentElement.style.setProperty('--fs', fs + 'px');
    document.documentElement.style.setProperty('--fsp', fsp + 'px');
    $('fs-val').textContent = fs + 'px'; $('fsp-val').textContent = fsp + 'px';
    if (cm) { cm.setOption('theme', theme === 'dark' ? 'material-darker' : 'default'); cm.refresh(); }
  }
  $('theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; store.set('pz_theme', theme); applyLook(); };
  $('fs-').onclick = () => { fs = Math.max(10, fs - 1); store.set('pz_fs', fs); applyLook(); };
  $('fs+').onclick = () => { fs = Math.min(28, fs + 1); store.set('pz_fs', fs); applyLook(); };
  $('fsp-').onclick = () => { fsp = Math.max(10, fsp - 1); store.set('pz_fsp', fsp); applyLook(); };
  $('fsp+').onclick = () => { fsp = Math.min(28, fsp + 1); store.set('pz_fsp', fsp); applyLook(); };

  /* --- 言語設定 --- */
  const PREFER_ORDER = ['Python', 'C++', 'Java', 'JavaScript', 'TypeScript', 'Ruby', 'Go', 'Rust', 'C#', 'C', 'PHP', 'Swift', 'Kotlin', 'Haskell', 'Perl', 'Lua'];
  const PREFER_COMPILER = {
    'C++': /^gcc-\d/, 'C': /^gcc-\d/, 'Python': /^cpython-\d/, 'Java': /^openjdk-/, 'JavaScript': /^nodejs-/,
    'Ruby': /^ruby-\d/, 'Rust': /^rust-\d/, 'Go': /^go-\d/, 'C#': /^(mono|dotnetcore)-/, 'PHP': /^php-\d/, 'Swift': /^swift-\d/
  };
  const MODE = [
    [/^c\+\+$/i, 'text/x-c++src'], [/^c$/i, 'text/x-csrc'], [/^c#$/i, 'text/x-csharp'], [/^java$/i, 'text/x-java'],
    [/^python/i, 'python'], [/^javascript/i, 'javascript'], [/^typescript/i, 'text/typescript'], [/^coffee/i, 'coffeescript'],
    [/^ruby/i, 'ruby'], [/^go$/i, 'go'], [/^rust/i, 'rust'], [/^php/i, 'text/x-php'], [/^swift/i, 'swift'],
    [/^kotlin/i, 'text/x-kotlin'], [/^scala/i, 'text/x-scala'], [/^bash|^shell/i, 'shell'], [/^perl/i, 'perl'], [/^lua/i, 'lua'],
    [/^haskell/i, 'haskell'], [/^ocaml/i, 'text/x-ocaml'], [/^f#/i, 'text/x-fsharp'], [/^d$/i, 'd'], [/^crystal/i, 'crystal'],
    [/^erlang/i, 'erlang'], [/^pascal/i, 'pascal'], [/^groovy/i, 'groovy'], [/^lisp/i, 'commonlisp'], [/^sql/i, 'sql'],
    [/^r$/i, 'r'], [/^julia/i, 'julia'], [/^dart/i, 'dart'], [/^fortran/i, 'fortran']
  ];
  const modeFor = lang => { const m = MODE.find(([re]) => re.test(lang)); return m ? m[1] : null; };

  const TEMPLATES = {
    'Python': 'import sys\ninput = sys.stdin.readline\n\n',
    'C++': '#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    ios::sync_with_stdio(false);\n    cin.tie(nullptr);\n\n    return 0;\n}\n',
    'C': '#include <stdio.h>\n\nint main(void) {\n\n    return 0;\n}\n',
    'Java': 'import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n\n    }\n}\n',
    'JavaScript': 'const lines = require("fs").readFileSync("/dev/stdin", "utf8").trim().split("\\n");\n\n',
    'TypeScript': 'const lines: string[] = require("fs").readFileSync("/dev/stdin", "utf8").trim().split("\\n");\n\n',
    'Ruby': 'n = gets.to_i\n',
    'Go': 'package main\n\nimport (\n\t"bufio"\n\t"fmt"\n\t"os"\n)\n\nfunc main() {\n\treader := bufio.NewReader(os.Stdin)\n\tvar n int\n\tfmt.Fscan(reader, &n)\n\tfmt.Println(n)\n}\n',
    'Rust': 'use std::io::{self, Read};\n\nfn main() {\n    let mut s = String::new();\n    io::stdin().read_to_string(&mut s).unwrap();\n\n}\n',
    'C#': 'using System;\n\nclass Program {\n    static void Main() {\n        var s = Console.ReadLine();\n\n    }\n}\n',
    'PHP': '<?php\n$n = (int)trim(fgets(STDIN));\n',
    'Swift': 'let n = Int(readLine()!)!\n'
  };

  /* --- コンパイラ一覧（Wandbox） --- */
  let byLang = {};       // 言語 -> [compiler]
  let langs = [];
  const verKey = c => ((c.version || c.name).match(/\d+(?:\.\d+)*/) || ['0'])[0].split('.').map(Number);
  function cmpVer(a, b) { const x = verKey(a), y = verKey(b); for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (y[i] || 0) - (x[i] || 0); if (d) return d; } return 0; }
  const isHead = c => /head|trunk|master/i.test(c.name) || /head/i.test(c.version || '');

  async function loadList() {
    $('status').textContent = 'コンパイラ一覧を取得中…';
    try {
      const res = await fetch('https://wandbox.org/api/list.json');
      const list = await res.json();
      byLang = {};
      for (const c of list) (byLang[c.language] = byLang[c.language] || []).push(c);
      for (const k in byLang) byLang[k].sort((a, b) => (isHead(a) - isHead(b)) || cmpVer(a, b));
      const all = Object.keys(byLang);
      langs = [...PREFER_ORDER.filter(l => byLang[l]), ...all.filter(l => !PREFER_ORDER.includes(l)).sort()];
      $('lang').innerHTML = '';
      for (const l of langs) $('lang').add(new Option(l, l));
      const saved = store.get('pz_lang', 'Python');
      $('lang').value = byLang[saved] ? saved : langs[0];
      $('status').textContent = '';
      setLanguage($('lang').value, true);
    } catch (e) {
      $('status').textContent = '一覧の取得に失敗（ネットワークを確認して再読込）';
    }
  }

  let curLang = null;
  // インデントの既定値（言語の慣習）。載っていない言語は4スペース。'tab' はタブ文字
  const INDENT = [
    [/^(ruby|javascript|typescript|coffee|crystal|elixir|haskell|ocaml|lisp|scala|bash|shell|sql|r$|dart|lua|pascal|nim|pony)/i, 2],
    [/^go$/i, 'tab']
  ];
  function indentConf(lang) {
    const m = INDENT.find(([re]) => re.test(lang));
    const v = m ? m[1] : 4;
    return v === 'tab' ? { indentWithTabs: true, indentUnit: 4, tabSize: 4 } : { indentWithTabs: false, indentUnit: v, tabSize: v };
  }
  // 括弧の自動補完: ' が別の意味を持つ言語（ライフタイム・型変数など）では ' を補完しない
  function bracketConf(lang) {
    const noApos = /^(rust|haskell|ocaml|f#|lisp|erlang)/i.test(lang);
    return { pairs: noApos ? '()[]{}""' : '()[]{}\'\'""', triples: /^python/i.test(lang) ? '"\'' : '', explode: '[]{}' };
  }
  function setLanguage(lang, initial) {
    if (!initial && curLang) store.set('pz_code_' + curLang, cm.getValue());
    curLang = lang; store.set('pz_lang', lang);
    // コンパイラ選択
    const sel = $('compiler'); sel.innerHTML = '';
    const cs = byLang[lang] || [];
    for (const c of cs) sel.add(new Option(`${c['display-name'] || c.name} ${c.version || ''}`.trim(), c.name));
    const savedC = store.get('pz_compiler_' + lang, null);
    const pref = PREFER_COMPILER[lang];
    const def = (savedC && cs.find(c => c.name === savedC)) || (pref && cs.find(c => !isHead(c) && pref.test(c.name))) || cs.find(c => !isHead(c)) || cs[0];
    if (def) sel.value = def.name;
    // エディタ
    cm.setOption('mode', modeFor(lang));
    cm.setOption('autoCloseBrackets', bracketConf(lang));
    const ind = indentConf(lang);
    cm.setOption('indentWithTabs', ind.indentWithTabs); cm.setOption('indentUnit', ind.indentUnit); cm.setOption('tabSize', ind.tabSize);
    cm.setValue(store.get('pz_code_' + lang, TEMPLATES[lang] || ''));
    cm.clearHistory();
    $('lang-label').textContent = lang;
    cm.focus();
  }
  $('lang').onchange = () => setLanguage($('lang').value, false);
  $('compiler').onchange = () => store.set('pz_compiler_' + curLang, $('compiler').value);

  /* --- エディタ（補完・自動括弧閉じは一切なし） --- */
  const cm = CodeMirror($('editor'), {
    lineNumbers: true, indentUnit: 4, tabSize: 4, indentWithTabs: false, smartIndent: true, matchBrackets: true, autoCloseBrackets: true,
    lineWrapping: false, inputStyle: 'contenteditable', spellcheck: false,
    theme: 'material-darker',
    extraKeys: {
      'Tab': c => c.somethingSelected() ? c.indentSelection('add') : c.replaceSelection(c.getOption('indentWithTabs') ? '\t' : ' '.repeat(c.getOption('indentUnit')), 'end'),
      'Shift-Tab': c => c.indentSelection('subtract'),
      // 行頭移動: 1回目=インデントを飛ばした最初の文字の左 / 2回目=0列目（以降は交互）。Shift併用で選択も同じ動き
      'Cmd-Left': 'goLineStartSmart', 'Home': 'goLineStartSmart',
      'Shift-Alt-F': () => reindent(),
      'Ctrl-Enter': () => run(), 'Cmd-Enter': () => run()
    }
  });
  cm.getInputField().setAttribute('autocomplete', 'off');
  cm.getInputField().setAttribute('autocapitalize', 'off');
  cm.getInputField().setAttribute('autocorrect', 'off');
  cm.getInputField().setAttribute('spellcheck', 'false');
  cm.on('change', () => { if (curLang) store.set('pz_code_' + curLang, cm.getValue()); });

  /* --- インデントの整形（Shift+Alt+F / Mac: ⇧⌥F）: 選択範囲があればその範囲、なければ全体 --- */
  const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  const REINDENT_KEY = isMac ? 'Shift+Opt+F' : 'Shift+Alt+F';
  const NO_REINDENT = /^(python|haskell|coffee|f#|nim|elixir)/i;   // インデントが意味を持つ言語では行わない
  let statusTimer = null;
  function flashStatus(msg) { const s = $('status'); s.textContent = msg; clearTimeout(statusTimer); statusTimer = setTimeout(() => { s.textContent = ''; }, 3500); }
  function reindent() {
    if (NO_REINDENT.test(curLang || '')) { flashStatus(curLang + ' はインデントが文の意味を決めるため、自動整形は行いません'); return; }
    const sel = cm.somethingSelected();
    const from = sel ? cm.getCursor('from').line : cm.firstLine();
    let to = sel ? cm.getCursor('to') : null;
    const toLine = sel ? (to.ch === 0 && to.line > from ? to.line - 1 : to.line) : cm.lastLine();
    cm.operation(() => { for (let l = from; l <= toLine; l++) if (cm.getLine(l).trim()) cm.indentLine(l, 'smart'); });
    flashStatus('インデントを整えました（' + (sel ? '選択範囲' : '全体') + '）');
    cm.focus();
  }
  $('btn-indent').textContent = 'インデントの整形（' + REINDENT_KEY + '）';
  $('btn-indent').title = 'ショートカット: ' + REINDENT_KEY + '（選択範囲があればその範囲だけ）';
  $('btn-indent').onclick = reindent;

  /* --- 予測変換（簡易版）: コード内で既に使われた変数・関数・クラス名だけを候補にする --- */
  let hintOn = store.get('pz_hint', '1') === '1';
  const IDENT = /^[A-Za-z_$][\w$]*$/;
  const SKIP_TYPE = /comment|string|keyword|builtin|atom|number|meta|operator|punctuation/;
  function wordHint(c) {
    const cur = c.getCursor();
    const m = /[A-Za-z_$][\w$]*$/.exec(c.getRange({ line: cur.line, ch: 0 }, cur));
    if (!m || m[0].length < 2) return null;
    const prefix = m[0];
    if (/comment|string/.test(c.getTokenAt(cur).type || '')) return null;
    const counts = new Map();
    const last = Math.min(c.lastLine(), 3000);
    for (let l = c.firstLine(); l <= last; l++) {
      for (const tk of c.getLineTokens(l)) {
        const w = tk.string;
        if (w === prefix || !w.startsWith(prefix) || !IDENT.test(w)) continue;
        if (SKIP_TYPE.test(tk.type || '')) continue;
        if (l === cur.line && tk.end === cur.ch) continue;         // 入力中の単語自身
        counts.set(w, (counts.get(w) || 0) + 1);
      }
    }
    if (!counts.size) return null;
    const list = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 20).map(e => e[0]);
    return { list, from: { line: cur.line, ch: cur.ch - prefix.length }, to: cur };
  }
  // Tab で確定。Enter は割り当てないので、候補表示中でも常に改行になる
  const HINT_KEYS = {
    Up: (c, h) => h.moveFocus(-1), Down: (c, h) => h.moveFocus(1),
    PageUp: (c, h) => h.moveFocus(-h.menuSize() + 1, true), PageDown: (c, h) => h.moveFocus(h.menuSize() - 1, true),
    Tab: (c, h) => h.pick(), Esc: (c, h) => h.close()
  };
  cm.on('inputRead', (c, ch) => {
    // IME変換中の入力（origin が +input 以外）では出さない
    if (!hintOn || ch.origin !== '+input' || c.state.completionActive) return;
    if (!/^[\w$]$/.test(ch.text[0] || '')) return;
    c.showHint({ hint: wordHint, completeSingle: false, closeCharacters: /[^\w$]/, customKeys: HINT_KEYS });
  });
  function applyHintToggle() {
    const b = $('hint-toggle');
    b.textContent = '予測変換: ' + (hintOn ? 'ON' : 'OFF');
    b.classList.toggle('on', hintOn); b.classList.toggle('off', !hintOn);
    if (!hintOn && cm.state.completionActive) cm.state.completionActive.close();
  }
  $('hint-toggle').onclick = () => { hintOn = !hintOn; store.set('pz_hint', hintOn ? '1' : '0'); applyHintToggle(); cm.focus(); };
  applyHintToggle();

  /* --- 問題文 --- */
  const raw = $('problem-raw'), view = $('problem-view'), stdin = $('stdin');
  let lastAutoStdin = null;

  function renderProblem() {
    const text = raw.value;
    view.innerHTML = '';
    if (!text.trim()) { showRaw(); return; }
    const blocks = parseProblem(text);
    for (const b of blocks) {
      let el;
      if (b.type === 'h') { el = document.createElement('h3'); el.className = b.kind; el.textContent = b.text; }
      else if (b.type === 'p') { el = document.createElement('p'); b.lines.forEach((l, i) => { if (i) el.appendChild(document.createElement('br')); el.appendChild(document.createTextNode(l)); }); }
      else if (b.type === 'ul') {
        el = document.createElement('ul');
        for (const it of b.items) { const li = document.createElement('li'); if (it.code) { const c = document.createElement('code'); c.className = 'mono'; c.textContent = it.text; li.appendChild(c); } else li.textContent = it.text; el.appendChild(li); }
      } else if (b.type === 'pre') {
        const pre = document.createElement('pre'); pre.className = 'mono'; pre.textContent = b.text;
        if (b.sample === 'in') {
          el = document.createElement('div'); el.className = 'sample'; el.appendChild(pre);
          const btn = document.createElement('button'); btn.className = 'small'; btn.textContent = '標準入力へ';
          btn.onclick = () => { stdin.value = b.text; store.set('pz_stdin', stdin.value); lastAutoStdin = b.text; };
          el.appendChild(btn);
        } else el = pre;
      }
      if (el) view.appendChild(el);
    }
    // 標準入力が空（または自動投入のまま）なら、入力例1を自動セット
    const s = firstSampleInput(blocks);
    if (s !== null && (!stdin.value.trim() || stdin.value === lastAutoStdin)) { stdin.value = s; lastAutoStdin = s; store.set('pz_stdin', s); }
    showView();
  }
  function showRaw() { raw.hidden = false; view.hidden = true; $('btn-edit').textContent = '整形表示'; }
  function showView() { raw.hidden = true; view.hidden = false; $('btn-edit').textContent = '原文を編集'; }
  function setProblem(t) { raw.value = t; store.set('pz_problem', t); renderProblem(); }

  raw.addEventListener('paste', () => setTimeout(() => { store.set('pz_problem', raw.value); renderProblem(); }, 0));
  raw.addEventListener('input', () => store.set('pz_problem', raw.value));
  view.addEventListener('paste', e => { e.preventDefault(); const t = (e.clipboardData || window.clipboardData).getData('text'); if (t.trim()) setProblem(t); });
  $('btn-edit').onclick = () => { if (raw.hidden) { showRaw(); raw.focus(); } else renderProblem(); };
  $('btn-clear').onclick = () => { raw.value = ''; store.set('pz_problem', ''); view.innerHTML = ''; showRaw(); raw.focus(); };
  stdin.addEventListener('input', () => store.set('pz_stdin', stdin.value));
  $('btn-stdin-clear').onclick = () => { stdin.value = ''; store.set('pz_stdin', ''); lastAutoStdin = null; stdin.focus(); };
  stdin.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); } });

  /* --- 実行 --- */
  const out = $('output');
  function addBlock(label, text, cls) {
    if (label) { const l = document.createElement('div'); l.className = 'label'; l.textContent = label; out.appendChild(l); }
    const p = document.createElement('pre'); if (cls) p.className = cls; p.textContent = text; out.appendChild(p);
  }
  let running = false;
  async function run() {
    if (running || !curLang) return;
    running = true; $('run').disabled = true; $('run').textContent = '実行中…';
    out.innerHTML = '';
    let input = stdin.value; if (input && !input.endsWith('\n')) input += '\n';
    const t0 = performance.now();
    try {
      const res = await fetch('https://wandbox.org/api/compile.json', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ compiler: $('compiler').value, code: cm.getValue(), stdin: input, save: false })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text()).slice(0, 300));
      const r = await res.json();
      const ms = Math.round(performance.now() - t0);
      if (r.compiler_error || r.compiler_message) addBlock('コンパイラ出力', r.compiler_error || r.compiler_message, r.compiler_error ? 'err' : '');
      if (r.program_output) addBlock('標準出力', r.program_output);
      else if (!r.compiler_error && !r.program_error) addBlock('標準出力', '（出力なし）');
      if (r.program_error) addBlock('標準エラー出力', r.program_error, 'err');
      const meta = document.createElement('div'); meta.className = 'meta';
      const code = String(r.status ?? '');
      meta.innerHTML = '終了コード: <span class="' + (code === '0' ? 'good' : 'bad') + '"></span>' + (r.signal ? ' / シグナル: ' + '<span class="bad"></span>' : '') + ' ／ ' + ms + ' ms（通信込み）';
      const spans = meta.querySelectorAll('span'); spans[0].textContent = code || '-'; if (r.signal) spans[1].textContent = r.signal;
      out.appendChild(meta);
    } catch (e) {
      addBlock('実行に失敗しました', String(e.message || e), 'err');
    } finally {
      running = false; $('run').disabled = false; $('run').textContent = '実行';
    }
  }
  $('run').onclick = run;
  $('btn-copy-out').onclick = async () => { try { await navigator.clipboard.writeText(out.innerText); const b = $('btn-copy-out'); b.textContent = 'コピーしました'; setTimeout(() => b.textContent = 'コピー', 1200); } catch (e) {} };
  document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); } });

  /* --- ドラッグで境界を動かす --- */
  document.querySelectorAll('[data-split]').forEach(sp => {
    sp.addEventListener('pointerdown', e => {
      e.preventDefault(); sp.setPointerCapture(e.pointerId);
      const target = $(sp.dataset.target), type = sp.dataset.split;
      const move = ev => {
        if (type === 'v') { const l = target.getBoundingClientRect().left; target.style.width = Math.max(200, ev.clientX - l) + 'px'; }
        else { const b = target.parentElement.getBoundingClientRect().bottom; target.style.height = Math.max(60, b - ev.clientY) + 'px'; }
        cm.refresh();
      };
      const up = () => { sp.removeEventListener('pointermove', move); sp.removeEventListener('pointerup', up); };
      sp.addEventListener('pointermove', move); sp.addEventListener('pointerup', up);
    });
  });

  /* --- 起動 --- */
  stdin.value = store.get('pz_stdin', '');
  raw.value = store.get('pz_problem', '');
  applyLook();
  if (raw.value.trim()) renderProblem(); else showRaw();
  loadList();
})();
</script>
</body>
</html>
